<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Colaboradores</title>

    <link rel="stylesheet" href="estillo.css">
</head>

<body>

    <div class="container">

        <h1>Lojas Brincos e Companhia</h1>
        <h2>Cadastro de Novo Colaborador</h2>

        <form action="processaCadastro.php" method="POST">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nomeCompleto" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idadeColaborador" required>

            <label for="profissao">Profissão:</label>
            <input type="text" id="profissao" name="profissaoColaborador" required>

            <label for="salario">Salário pretendido:</label>
            <input type="number" id="salario" name="salarioPretendido" required>

            <label for="experiencia">Experiência anterior:</label>
            <textarea id="experiencia" name="experienciaAnterior" rows="5"></textarea>

            <button type="submit">Cadastrar</button>

        </form>

    </div>

</body>
</html>
